server.port=8080
spring.application.name=scalable-read-api

# --- In-memory H2 database ---
spring.datasource.url=jdbc:h2:mem:postsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Needed to count SQL statements in the N+1 demo endpoints
spring.jpa.properties.hibernate.generate_statistics=true

# --- Pagination limits ---
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# --- Ehcache (through JCache) ---
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

# --- Experiment settings ---
app.seed.posts=500
# Simulates an expensive analytics computation so that caching gains are visible
app.analytics.simulated-delay-ms=500

logging.level.com.example.dashboard=INFO
